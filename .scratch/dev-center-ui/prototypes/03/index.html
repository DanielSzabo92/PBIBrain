<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare grid</title>
<!-- Prototype for ticket 03 (compare grid). Never shipped.
     Query: ?theme=dark|light&screen=grid|loading|empty|error|nomatch&sel=N|all&menu=1&confirm=keep|remove&diff=1&pane=1&tip=1&strict=1 -->
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  .shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: 100vh; }
  .sidebar { background: var(--bg-sidebar); border-right: 1px solid var(--line); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; }
  .brand { font-weight: 600; padding: 4px 10px 16px; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 0 10px; min-height: 32px; border-radius: var(--radius); color: var(--text-2); }
  .nav[aria-current="page"] { background: var(--surface-3); color: var(--text); }
  .main { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .topbar { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 20px; border-bottom: 1px solid var(--line); color: var(--text-2); white-space: nowrap; overflow: hidden; }
  .work { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 16px 24px 0; gap: 12px; }
  .work-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  h2 { font-size: 16px; margin: 0; font-weight: 600; }
  .muted { color: var(--text-2); }
  .small { font-size: 12px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  .tabs { padding-bottom: 6px; }
  .tab { padding: 4px 12px; color: var(--text-2); border-radius: var(--radius); }
  .tab[aria-selected="true"] { color: var(--text); background: var(--surface-3); font-weight: 500; }

  .area { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding-bottom: 16px; }
  .area.with-pane { grid-template-columns: minmax(0, 1fr) 360px; }
  .compare { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; }

  .btn { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--control-border); background: var(--surface); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--surface-hover); }
  .btn:active { background: var(--surface-3); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn[aria-expanded="true"] { background: var(--surface-3); }
  .btn.has-value { border-color: var(--brand); color: var(--brand); }
  .btn-primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .btn-primary:hover { background: var(--brand-strong); border-color: var(--brand-strong); }
  .btn-danger-fill { background: var(--bad); color: var(--text-inverse); border-color: var(--bad); }
  .btn-ghost { border-color: transparent; background: none; }
  .btn-sm { min-height: 28px; padding: 0 8px; font-size: 13px; }
  .link { background: none; border: 0; color: var(--brand); padding: 0; cursor: pointer; text-decoration: underline; }

  /* Toolbar (filter bar) and bulk bar share one slot */
  .toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 40px; }
  .search { display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; border: 1px solid var(--control-border); border-radius: var(--radius); background: var(--surface); width: 200px; }
  .search input { border: 0; background: none; outline: none; flex: 1; min-width: 0; }
  .search:focus-within { outline: 2px solid var(--ring); outline-offset: 1px; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--control-border); border-radius: var(--radius); overflow: hidden; }
  .seg button { border: 0; background: var(--surface); padding: 0 12px; min-height: 30px; cursor: pointer; }
  .seg button:hover { background: var(--surface-hover); }
  .seg button[aria-checked="true"] { background: var(--brand-tint); color: var(--brand); font-weight: 500; }
  .seg-label { color: var(--text-2); font-size: 12px; margin-right: 4px; }
  .bulkbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 40px; padding: 0 8px 0 12px; border: 1px solid var(--brand-line); background: var(--brand-tint); border-radius: var(--radius); }
  .bulkbar b { font-weight: 600; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 8px; border: 1px solid var(--control-border); border-radius: 999px; background: var(--surface); }
  .chip button { border: 0; background: none; padding: 2px; display: inline-flex; border-radius: 999px; cursor: pointer; color: var(--text-2); min-width: 24px; min-height: 24px; align-items: center; justify-content: center; }
  .chip button:hover { background: var(--surface-hover); color: var(--text); }
  .selall { font-size: 13px; color: var(--text-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* Grid */
  .grid-frame { position: relative; flex: 1; min-height: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; display: flex; flex-direction: column; }
  .grid-scroll { flex: 1; min-height: 0; overflow: auto; position: relative; }
  .grid { position: relative; }
  .row { display: grid; grid-template-columns: var(--cols); height: 36px; align-items: stretch; }
  .hrow { position: sticky; top: 0; z-index: 3; background: var(--surface-2); height: 34px; border-bottom: 1px solid var(--line); }
  .body { position: relative; }
  .body .row { position: absolute; left: 0; right: 0; border-bottom: 1px solid var(--line); background: var(--surface); }
  .body .row:hover, .body .row:hover .cell { background: var(--surface-hover); }
  .body .row[aria-selected="true"], .body .row[aria-selected="true"] .cell { background: var(--row-selected); }
  .body .row.active, .body .row.active .cell { background: var(--row-active); }
  .cell, .hcell { display: flex; align-items: center; gap: 6px; padding: 0 10px; min-width: 0; white-space: nowrap; overflow: hidden; background: inherit; }
  .hcell { font-size: 12px; color: var(--text-2); font-weight: 500; background: var(--surface-2); }
  .hcell .src-kind { color: var(--text-3); font-weight: 400; }
  .cell:focus-visible, .hcell:focus-visible { outline-offset: -2px; }
  .stick { position: sticky; z-index: 2; }
  .body .stick { background: var(--surface); }
  .c-chk { left: 0; justify-content: center; padding: 0; }
  .c-obj { left: 40px; }
  .c-rs { left: 300px; }
  .c-tg { left: 416px; border-right: 1px solid var(--line-strong); }
  .obj { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .obj .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
  .obj .tb { font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; }
  .typ { color: var(--text-2); }
  input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--brand); cursor: pointer; }
  .skel { height: 10px; border-radius: 4px; background: var(--surface-3); width: 70%; }

  .st { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; }
  .st svg.i { width: 14px; height: 14px; }
  .st-conflict { color: var(--cmp-conflict); font-weight: 600; }
  .st-missing { color: var(--cmp-missing); }
  .st-renamed { color: var(--cmp-renamed); }
  .st-moved { color: var(--cmp-moved); }
  .st-different { color: var(--cmp-different); }
  .st-same { color: var(--cmp-same); }
  .st-target { color: var(--text); }
  .cnt { color: var(--text-2); font-size: 12px; }
  .chg { color: var(--cmp-changed); display: inline-flex; }
  .chg svg.i { width: 10px; height: 10px; fill: currentColor; stroke: none; }
  .mc { font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
  .mc.none { color: var(--text-3); }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 1px 6px; border-radius: 999px; white-space: nowrap; }
  .b-prop { color: var(--proposal); background: var(--proposal-soft); }
  .b-mark { color: var(--warn); background: var(--warn-tint); }
  .b-chg { color: var(--proposal); background: var(--brand-tint); }
  .badge svg.i { width: 12px; height: 12px; }

  .foot-counts { display: contents; }
  .grid-foot { flex: none; display: flex; gap: 16px; white-space: nowrap; overflow: hidden; align-items: center; padding: 6px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-2); background: var(--surface-2); }

  /* States inside the grid frame */
  .state { margin: auto; max-width: 440px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 32px 16px; }
  .state svg.i { width: 28px; height: 28px; color: var(--text-3); }
  .state.err svg.i { color: var(--bad); }
  .state h2 { font-size: 20px; }
  .loadbar { position: absolute; left: 0; right: 0; top: 34px; height: 2px; background: var(--brand); z-index: 4; animation: lb 1.2s var(--ease-out) infinite; transform-origin: left; }
  @keyframes lb { 0% { transform: scaleX(0.05); } 100% { transform: scaleX(1); opacity: 0.2; } }
  @media (prefers-reduced-motion: reduce) { .loadbar { animation: none; } }

  /* Popover, menu, tooltip, dialog, toast */
  .pop { position: fixed; z-index: 20; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: var(--shadow-md); padding: 6px; min-width: 220px; max-width: 320px; }
  .pop h3 { font-size: 12px; color: var(--text-2); font-weight: 500; margin: 4px 8px 6px; }
  .opt { display: flex; align-items: center; gap: 8px; padding: 0 8px; min-height: 30px; border-radius: 6px; cursor: pointer; }
  .opt:hover { background: var(--surface-hover); }
  .opt .n { margin-left: auto; color: var(--text-2); font-size: 12px; }
  .menu [role="menuitem"] { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 0 8px; min-height: 32px; border-radius: 6px; cursor: pointer; }
  .menu [role="menuitem"]:hover, .menu [role="menuitem"]:focus-visible { background: var(--surface-hover); outline: none; }
  .menu [role="menuitem"].danger { color: var(--bad); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .menu .grp { font-size: 12px; color: var(--text-2); padding: 4px 8px; }
  .tip { position: fixed; z-index: 30; background: var(--surface-3); border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px 10px; box-shadow: var(--shadow-md); font-size: 12px; max-width: 300px; }
  .tip ul { margin: 4px 0 0; padding-left: 16px; }
  .tip code { font-family: var(--font-code); }
  .scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.5); z-index: 40; display: grid; place-items: center; padding: 16px; }
  .dialog { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 20px; width: min(480px, 100%); display: flex; flex-direction: column; gap: 12px; }
  .dialog .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .dialog ul { margin: 0; padding-left: 18px; color: var(--text-2); }
  .diff { width: 92vw; height: 86vh; max-width: none; padding: 0; gap: 0; overflow: hidden; }
  .diff-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .diff-body { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: 1fr; font-family: var(--font-code); font-size: 13px; background: var(--code-bg); }
  .diff-body.split { grid-template-columns: 1fr 1fr; }
  .diff-col { min-width: 0; border-right: 1px solid var(--line); }
  .diff-col h3 { position: sticky; top: 0; margin: 0; padding: 6px 12px; font: 500 12px var(--font-ui); color: var(--text-2); background: var(--surface-2); border-bottom: 1px solid var(--line); }
  .dl { display: grid; grid-template-columns: 40px 20px 1fr; white-space: pre; line-height: 20px; }
  .dl .ln { color: var(--text-3); text-align: right; padding-right: 8px; user-select: none; }
  .dl .mk { color: var(--text-2); }
  .dl.add { background: var(--ok-soft); } .dl.add .mk { color: var(--ok); }
  .dl.del { background: var(--bad-soft); } .dl.del .mk { color: var(--bad); }
  .toast { position: fixed; right: 24px; bottom: 24px; z-index: 50; background: var(--surface-3); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 10px 14px; box-shadow: var(--shadow-md); display: flex; gap: 8px; align-items: center; }
  .toast svg.i { color: var(--ok); }

  /* Row detail pane (placeholder for ticket 04) */
  .pane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; }
  .pane-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .pane ul { margin: 0; padding-left: 18px; }
  .pane .ph { border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 12px; color: var(--text-2); font-size: 13px; }
  @media (max-width: 1279.98px) {
    .area.with-pane { grid-template-columns: minmax(0, 1fr); }
    .pane { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 92vw); z-index: 35; border-radius: 0; box-shadow: var(--shadow-lg); }
    /* Below 1280 only the checkbox and Object columns stay sticky. */
    .c-rs, .c-tg { position: static; }
    .foot-counts { display: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <nav class="sidebar" aria-label="Main">
    <div class="brand">PBIBrain</div>
    <div class="nav">Overview</div><div class="nav">Search</div><div class="nav">Graph</div>
    <div class="nav" aria-current="page">Development Center</div><div class="nav">Settings</div>
  </nav>
  <div class="main">
    <div class="topbar">Development Center <span aria-hidden="true">&gt;</span> Sales master merge <span aria-hidden="true">&gt;</span> <span style="color:var(--text)">Compare</span></div>

<script>
// ---------- icons (lucide paths, inline SVG, currentColor) ----------
const P = {
  conflict: '<polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>',
  missing: '<circle cx="12" cy="12" r="9" stroke-dasharray="3.5 3.5"/>',
  renamed: '<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
  moved: '<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/>',
  different: '<path d="M5 9h14"/><path d="M5 15h14"/><path d="M19 5 5 19"/>',
  same: '<path d="M5 9h14"/><path d="M5 15h14"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  bot: '<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>',
  dot: '<circle cx="12" cy="12" r="10"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  code: '<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>',
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  compare: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M11 18H8a2 2 0 0 1-2-2V9"/>',
  filterx: '<path d="M13.013 3H2l8 9.46V19l4 2v-8.54l.9-1.055"/><path d="m22 3-5 5"/><path d="m17 3 5 5"/>',
  flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',
  measure: '<path d="M18 7V4H6l6 8-6 8h12v-3"/>',
  column: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 3v18"/>',
  table: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/>',
  rel: '<path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><path d="M8 12h8"/>',
  hier: '<rect width="6" height="6" x="9" y="2" rx="1"/><rect width="6" height="6" x="2" y="16" rx="1"/><rect width="6" height="6" x="16" y="16" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/>',
  part: '<path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>',
};
const ic = (k, label) => `<svg class="i" viewBox="0 0 24 24" ${label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"'}>${P[k]}</svg>`;

// ---------- fixture: section 14.1 shape, deterministic ----------
let seed = 7; const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
const pick = (a) => a[Math.floor(rnd() * a.length)];
const SOURCES = [
  { source_id: 's0', name: 'Sales Master', role: 'target', kind: 'PBIP' },
  { source_id: 's1', name: 'Sales A', role: 'donor', kind: 'PBIP' },
  { source_id: 's2', name: 'Sales B', role: 'donor', kind: 'PBIP' },
  { source_id: 's3', name: 'Finance', role: 'donor', kind: 'TMDL' },
  { source_id: 's4', name: 'Ops cloud', role: 'donor', kind: 'Cloud' },
];
const DONORS = SOURCES.slice(1);
const TYPES = [['Measure', 'measure', 45], ['Data column', 'column', 25], ['Calculated column', 'column', 6], ['Table', 'table', 6], ['Relationship', 'rel', 6], ['Hierarchy', 'hier', 4], ['Partition', 'part', 4], ['Calculation item', 'measure', 4]];
const TABLES = ['Sales', 'Customer', 'Product', 'Date', 'Store', 'Budget', 'Region', 'Returns', 'Inventory', 'Finance', 'Promotion', 'Channel', 'Employee', 'Currency', 'Scenario', 'Account', 'Supplier', 'Orders', 'Targets', 'Forecast'];
const W1 = ['Total', 'Net', 'Gross', 'Avg', 'YTD', 'PY', 'MTD', 'Rolling', 'Max', 'Min', 'Distinct', 'Running'];
const W2 = ['Sales', 'Margin', 'Cost', 'Units', 'Orders', 'Returns', 'Revenue', 'Discount', 'Budget', 'Price', 'Customers', 'Stock'];
const W3 = ['', '', ' %', ' Var', ' LY', ' Growth', ' Target', ' Delta'];
const FOLDERS = ['KPIs', 'Base', 'Time intelligence', 'Ratios', '', ''];
const PHRASES = [
  { phrase_id: 'expression_changed', text: 'expression changed' },
  { phrase_id: 'format_string_changed', text: 'format string', old: '#,0', new: '#,0.00' },
  { phrase_id: 'display_folder_changed', text: 'display folder', old: 'Base', new: 'KPIs' },
  { phrase_id: 'hidden_changed', text: 'hidden', old: 'No', new: 'Yes' },
  { phrase_id: 'description_changed', text: 'description changed' },
  { phrase_id: 'data_type_changed', text: 'data type', old: 'Int64', new: 'Decimal' },
];
const PREC = ['conflict', 'missing', 'renamed', 'moved', 'different', 'same'];
const WORD = { conflict: 'Type conflict', missing: 'Missing', renamed: 'Renamed', moved: 'Moved', different: 'Different', same: 'Same', target: 'Target' };
function pickType() { let r = rnd() * 100; for (const t of TYPES) { if ((r -= t[2]) < 0) return t; } return TYPES[0]; }
function genRows(n) {
  const rows = [];
  for (let i = 0; i < n; i++) {
    const t = pickType(); const table = pick(TABLES);

  body.addEventListener('mouseout', (e) => { if (e.target.closest('.cell[data-tip]')) hideTip(); });
  $('hchk').addEventListener('click', (e) => { e.preventDefault(); if (S.sel.size || S.allMatching) { S.sel.clear(); S.allMatching = false; } else [...S.pages.values()].flat().forEach(r => S.sel.add(r.row_key)); live(`${fmt(S.sel.size)} selected.`); renderAll(); });
  $('grid').addEventListener('keydown', (e) => {
    const { r, c } = S.focus; const page = Math.floor($('gs').clientHeight / ROWH) - 1; const total = S.total || 0;
    const k = e.key; let handled = true;
    if (k === 'ArrowDown') { if (e.shiftKey) toggle(r + 1, true); setFocus(r + 1, c); }
    else if (k === 'ArrowUp') { if (e.shiftKey) toggle(r - 1, true); setFocus(r - 1, c); }
    else if (k === 'ArrowRight') setFocus(r, c + 1); else if (k === 'ArrowLeft') setFocus(r, c - 1);
    else if (k === 'Home') e.ctrlKey ? setFocus(0, c) : setFocus(r, 0);
    else if (k === 'End') e.ctrlKey ? setFocus(total - 1, c) : setFocus(r, NCOL - 1);
    else if (k === 'PageDown') setFocus(r + page, c); else if (k === 'PageUp') setFocus(r - page, c);
    else if (k === 'Enter') openRow(r);
    else if (k === ' ') toggle(r, e.shiftKey);
    else if (k === 'a' && e.ctrlKey) { [...S.pages.values()].flat().forEach(x => S.sel.add(x.row_key)); renderAll(); }
    else if (k === 'Escape') { if (S.sel.size) { S.sel.clear(); S.allMatching = false; renderAll(); } else if (S.active) { S.active = null; renderAll(); } }
    else if ((k === 'd' || k === 'D') && c >= 4 && c < 4 + DONORS.length) { const x = rowAt(r); if (x && x.cells[DONORS[c - 4].source_id].state !== 'same') openDiff(x, DONORS[c - 4]); }
    else if ((k === 'm' || k === 'M') && S.sel.size) openMenu($('mcbtn'));
    else handled = false;
    if (handled) e.preventDefault();
  });
}
document.addEventListener('keydown', (e) => { if (e.key === '/' && !e.target.matches('input')) { const q = $('q'); if (q) { e.preventDefault(); q.focus(); } } });

// ---------- tooltip, popovers, menu, dialogs ----------
function showTip(cell) {
  const r = rowAt(+cell.dataset.r); if (!r) return; const c = +cell.dataset.c; let html;
  if (c === NCOL - 2) html = `<b>Agent proposal</b><div>${choiceText(r.proposal.choice)}, confidence ${r.proposal.confidence}</div><div class="muted">Accept or reject it in the row detail.</div>`;
  else { const d = DONORS[c - 4]; const x = r.cells[d.source_id]; html = `<b>${esc(d.name)}: ${WORD[x.state]}</b><ul>${x.properties.map(p => `<li>${esc(p.text)}${p.old ? `: <code>${esc(p.old)}</code> to <code>${esc(p.new)}</code>` : ''}</li>`).join('')}${x.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>${x.state !== 'same' ? '<div class="muted">Press D for the code diff.</div>' : ''}`; }
  hideTip(); const t = document.createElement('div'); t.className = 'tip'; t.id = 'tip'; t.setAttribute('role', 'tooltip'); t.innerHTML = html; document.body.appendChild(t);
  const b = cell.getBoundingClientRect(); const tb = t.getBoundingClientRect();
  t.style.left = Math.max(8, Math.min(innerWidth - tb.width - 8, b.left)) + 'px'; t.style.top = (b.bottom + tb.height + 8 > innerHeight ? b.top - tb.height - 6 : b.bottom + 6) + 'px';
  cell.setAttribute('aria-describedby', 'tip');
}
function hideTip() { const t = $('tip'); if (t) t.remove(); document.querySelectorAll('[aria-describedby="tip"]').forEach(e => e.removeAttribute('aria-describedby')); }
function closeLayer() { $('layer').innerHTML = ''; document.querySelectorAll('[aria-expanded="true"]').forEach(b => b.setAttribute('aria-expanded', 'false')); }
function place(el, trig) { const b = trig.getBoundingClientRect(); const w = el.getBoundingClientRect().width; el.style.top = b.bottom + 4 + 'px'; el.style.left = Math.max(8, Math.min(innerWidth - w - 8, b.left)) + 'px'; }
function openFilter(btn) {
  closeLayer(); btn.setAttribute('aria-expanded', 'true'); const id = btn.dataset.filter; let body = '';
  const cb = (k, v, label, n, on) => `<label class="opt"><input type="checkbox" data-k="${k}" value="${esc(v)}" ${on ? 'checked' : ''}>${label}${n != null ? `<span class="n">${fmt(n)}</span>` : ''}</label>`;
  const all = {}; ALL.forEach(r => all[r.row_state] = (all[r.row_state] || 0) + 1);
  if (id === 'state') body = cb('state', 'notsame', 'Not same (hide Same rows)', ALL.length - (all.same || 0), S.f.state.has('notsame')) + '<hr style="border:0;border-top:1px solid var(--line)">' + PREC.map(p => cb('state', p, `<span class="st st-${p}">${ic(p)}${WORD[p]}</span>`, all[p] || 0, S.f.state.has(p))).join('');
  else if (id === 'type') body = TYPES.map(t => cb('type', t[0], t[0], ALL.filter(r => r.object_type === t[0]).length, S.f.type.has(t[0]))).join('');
  else if (id === 'table') body = TABLES.slice(0, 10).map(t => cb('table', t, t, null, S.f.table.has(t))).join('') + '<div class="muted small" style="padding:4px 8px">Type to find more tables (Combobox).</div>';
  else if (id === 'source') body = DONORS.map(d => cb('source', d.source_id, 'Not same in ' + esc(d.name), null, S.f.source.has(d.source_id))).join('');
  else if (id === 'marks') body = cb('marks', '1', 'Source changed, needs confirm', ALL.filter(r => r.source_marks.length).length, S.f.marks);
  else if (id === 'changed') body = cb('changed', '1', 'Changed since the last check (Today 10:42)', null, S.f.changed);
  else if (id === 'page') body = '<div class="muted small" style="padding:8px">This session has no report source, so no pages.</div>';
  else body = FOLDERS.filter(Boolean).map(f => cb('folder', f, f, null, false)).join('');
  $('layer').innerHTML = `<div class="pop" role="dialog" aria-label="${btn.textContent.trim()} filter"><h3>${btn.textContent.trim()}</h3>${body}</div>`;
  const pop = $('layer').firstChild; place(pop, btn);
  pop.addEventListener('change', (e) => { const k = e.target.dataset.k; if (k === 'marks' || k === 'changed') S.f[k] = e.target.checked; else if (S.f[k]) e.target.checked ? S.f[k].add(e.target.value) : S.f[k].delete(e.target.value); startFilter(); });
  const f = pop.querySelector('input'); if (f) f.focus();
}
function openMenu(btn) {
  closeLayer(); btn.setAttribute('aria-expanded', 'true');
  $('layer').innerHTML = `<div class="pop menu" role="menu" aria-label="Set Merge Choice">
    <button role="menuitem" data-c="keep_target">Keep target</button><div class="grp" role="presentation">Take from</div>
    ${DONORS.map(d => `<button role="menuitem" data-c="take_from" data-s="${d.source_id}">Take from ${esc(d.name)}</button>`).join('')}
    <button role="menuitem" data-c="skip">Skip</button><hr role="separator"><button role="menuitem" class="danger" data-c="remove">Remove from target</button></div>`;
  const m = $('layer').firstChild; place(m, btn); m.querySelector('[role=menuitem]').focus();
  m.addEventListener('click', (e) => { const it = e.target.closest('[role=menuitem]'); if (it) bulkChoose({ kind: it.dataset.c, source_id: it.dataset.s }); });
  m.addEventListener('keydown', (e) => { const items = [...m.querySelectorAll('[role=menuitem]')]; const i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') items[(i + 1) % items.length].focus(); else if (e.key === 'ArrowUp') items[(i - 1 + items.length) % items.length].focus(); else if (e.key === 'Escape') { closeLayer(); btn.focus(); } else return; e.preventDefault(); });
}
function bulkImpact(choice) {
  const rows = S.allMatching ? S.f.cache : [...S.pages.values()].flat().filter(r => S.sel.has(r.row_key));
  const skipped = choice.kind === 'take_from' ? rows.filter(r => r.cells[choice.source_id].state === 'missing').length : choice.kind === 'remove' ? rows.filter(r => r.cells.s0.state === 'missing').length : 0;
  const changes = rows.filter(r => r.merge_choice && choiceText(r.merge_choice) !== choiceText(choice)).length;
  return { n: rows.length, skipped, changes };
}
function bulkChoose(choice) {
  closeLayer(); const im = bulkImpact(choice);
  if (choice.kind === 'remove' || im.changes) return openConfirm(choice, im);
  runBulk(choice, im);
}
function openConfirm(choice, im) {
  const rm = choice.kind === 'remove'; const n = im.n - im.skipped;
  const src = choice.source_id ? SOURCES.find(s => s.source_id === choice.source_id).name : '';
  $('layer').innerHTML = `<div class="scrim"><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dt" aria-describedby="dd">
    <h2 id="dt">${rm ? `Remove ${fmt(n)} objects from the target?` : `Set "${choiceText(choice)}" for ${fmt(n)} rows?`}</h2>
    <div id="dd"><ul>${rm ? '<li>The plan deletes these objects from the target model when you apply it.</li><li>Each removal uses the Block policy. Objects with dependents stay blocked until you set a policy in the row detail.</li>' : ''}
      ${im.changes ? `<li>${fmt(im.changes)} rows already have a different Merge Choice. This replaces it.</li>` : ''}
      ${im.skipped ? `<li>${fmt(im.skipped)} rows are skipped: ${rm ? 'the object is not in the target.' : `the object is missing in ${esc(src)}.`}</li>` : ''}</ul></div>
    <div class="acts"><button class="btn" id="dcancel">Cancel</button><button class="btn ${rm ? 'btn-danger-fill' : 'btn-primary'}" id="dok">${rm ? 'Remove from target' : 'Set Merge Choice'}</button></div></div></div>`;
  $('dcancel').onclick = () => { closeLayer(); $('mcbtn') && $('mcbtn').focus(); }; $('dok').onclick = () => { closeLayer(); runBulk(choice, im); };
  $('dcancel').focus();
}
function runBulk(choice, im) {
  // Real app: merge_choice_bulk_set({ base_revision, row_keys, choice }) through the JS API.
  const keys = S.allMatching ? S.f.cache.map(r => r.row_key) : [...S.sel];
  keys.forEach(k => { const r = ALL.find(x => x.row_key === k); if (r && !(choice.kind === 'take_from' && r.cells[choice.source_id].state === 'missing')) r.merge_choice = choice.kind === 'take_from' ? { kind: 'take_from', source_id: choice.source_id } : { kind: choice.kind }; });
  S.sel.clear(); S.allMatching = false; renderAll();
  toast(`Merge Choice set for ${fmt(im.n - im.skipped)} rows.${im.skipped ? ` ${fmt(im.skipped)} rows skipped.` : ''}`);
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.innerHTML = ic('check') + esc(msg); document.body.appendChild(t); setTimeout(() => t.remove(), 4000); }
function live(msg) { $('live').textContent = msg; }
function openDiff(r, donor) {
  const split = innerWidth >= 1280;
  const L = [`MEASURE '${r.table}'[${r.name}] =`, `    CALCULATE (`, `        SUM ( '${r.table}'[Amount] ),`, `        '${r.table}'[Status] = "Open"`, `    )`, `    formatString: #,0`, `    displayFolder: Base`];
  const R = [`MEASURE '${r.table}'[${r.name}] =`, `    CALCULATE (`, `        SUM ( '${r.table}'[Amount] ),`, `        '${r.table}'[Status] IN { "Open", "Hold" }`, `    )`, `    formatString: #,0.00`, `    displayFolder: KPIs`];
  const line = (n, mk, t, cls) => `<div class="dl ${cls}"><span class="ln">${n}</span><span class="mk" aria-hidden="true">${mk}</span><span>${cls === 'add' ? '<span class="sr-only">Added: </span>' : cls === 'del' ? '<span class="sr-only">Removed: </span>' : ''}${esc(t)}</span></div>`;
  const side = (a, mk, cls) => a.map((t, k) => line(k + 1, L[k] === R[k] ? ' ' : mk, t, L[k] === R[k] ? '' : cls)).join('');
  const uni = L.map((t, k) => L[k] === R[k] ? line(k + 1, ' ', t, '') : line(k + 1, '-', t, 'del') + line(k + 1, '+', R[k], 'add')).join('');
  $('layer').innerHTML = `<div class="scrim"><div class="dialog diff" role="dialog" aria-modal="true" aria-labelledby="dft">
    <div class="diff-head"><h2 id="dft">Code diff: ${esc(r.name)}</h2><span class="muted small">${S.mode === 'strict' ? 'Strict compare' : 'Default compare'}, DAX and TMDL</span><span class="spacer"></span>
    <span class="seg-label" id="dsl">Compare target with</span><div class="seg" role="radiogroup" aria-labelledby="dsl">${DONORS.map(d => `<button role="radio" aria-checked="${d === donor}">${esc(d.name)}</button>`).join('')}</div>
    <button class="btn btn-ghost btn-sm" id="dclose" aria-label="Close code diff">${ic('x')}</button></div>
    <div class="diff-body ${split ? 'split' : ''}">${split ? `<div class="diff-col"><h3>${esc(SOURCES[0].name)} (target)</h3>${side(L, '-', 'del')}</div><div class="diff-col"><h3>${esc(donor ? donor.name : '')}</h3>${side(R, '+', 'add')}</div>` : `<div class="diff-col"><h3>${esc(SOURCES[0].name)} to ${esc(donor ? donor.name : '')}</h3>${uni}</div>`}</div></div></div>`;
  $('dclose').onclick = closeLayer; $('dclose').focus();
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('layer').innerHTML) { closeLayer(); } });
document.addEventListener('mousedown', (e) => { const p = $('layer').querySelector('.pop'); if (p && !p.contains(e.target) && !e.target.closest('[aria-expanded]')) closeLayer(); });

// ---------- boot and screen presets ----------
// The app sets data-theme. Without ?theme the prototype follows the system scheme, so the kit gates can render both themes.
if (Q.get('theme') === 'light' || (!Q.get('theme') && matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.dataset.theme = 'light';
renderAll();
if (Q.get('screen') !== 'loading') load(0);
async function preset() {
  if (S.loading) return setTimeout(preset, 30);
  const sel = Q.get('sel'); if (sel) { const rows = S.pages.get(0); (sel === 'all' ? rows : rows.slice(0, +sel)).forEach(r => S.sel.add(r.row_key)); if (sel === 'allm') {} renderAll(); }
  if (Q.get('allm')) { S.pages.get(0).forEach(r => S.sel.add(r.row_key)); S.allMatching = true; renderAll(); }
  if (Q.get('pane')) { S.active = S.pages.get(0).find(r => DONORS.some(d => r.cells[d.source_id].properties.length)).row_key; renderAll(); }
  if (Q.get('menu')) openMenu($('mcbtn'));
  if (Q.get('confirm')) bulkChoose(Q.get('confirm') === 'remove' ? { kind: 'remove' } : { kind: 'take_from', source_id: 's2' });
  if (Q.get('diff')) { const r = S.pages.get(0).find(x => x.cells.s2.properties.length); openDiff(r, DONORS[1]); }
  if (Q.get('tip')) { const c = document.querySelector('.cell[data-tip]'); if (c) showTip(c); }
  if (Q.get('filter')) openFilter(document.querySelector(`[data-filter="${Q.get('filter')}"]`));
  document.body.dataset.ready = '1';
}
if (Q.get('screen') !== 'loading') preset(); else document.body.dataset.ready = '1';
</script>
