<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent proposals and log</title>
<!-- Prototype for ticket 06. Never shipped. Open with ?screen=<id>&theme=dark|light. -->
<link rel="stylesheet" href="tokens.css">
<style>
  /* New semantic tokens proposed by ticket 06 (alias of info in both themes). */
  :root { --proposal: var(--info); --proposal-soft: var(--info-soft); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
  .sidebar { background: var(--bg-sidebar); border-right: 1px solid var(--line); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; }
  .brand { font-weight: 600; padding: 4px 10px 16px; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 0 10px; min-height: 32px; border-radius: var(--radius); color: var(--text-2); border: 0; background: none; text-align: left; cursor: pointer; width: 100%; }
  .nav:hover { background: var(--surface-hover); color: var(--text); }
  .nav[aria-current="page"] { background: var(--surface-3); color: var(--text); }
  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 20px; border-bottom: 1px solid var(--line); color: var(--text-2); min-width: 0; }
  .crumb { color: var(--text-2); background: none; border: 0; padding: 4px 6px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .crumb:hover { color: var(--text); background: var(--surface-hover); }
  .crumb-now { color: var(--text); white-space: nowrap; }
  .content { padding: 24px; min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  h2 { font-size: 16px; margin: 0; font-weight: 600; }
  h3 { font-size: 14px; margin: 0; font-weight: 600; }
  p { margin: 0; }
  .muted { color: var(--text-2); }
  .small { font-size: 12px; }
  .code { font-family: var(--font-code); font-size: 12px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .btn { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--control-border); background: var(--surface); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--surface-hover); }
  .btn:active { background: var(--surface-3); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn-primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .btn-primary:hover { background: var(--brand-strong); border-color: var(--brand-strong); }
  .btn-ghost { border-color: transparent; background: none; }
  .btn-sm { min-height: 28px; padding: 0 10px; font-size: 13px; }
  .link { background: none; border: 0; padding: 0; color: var(--text); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; text-align: left; }
  .link:hover { color: var(--brand-strong); }

  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .status svg.i { width: 14px; height: 14px; }
  .s-ok { color: var(--ok); background: var(--ok-soft); }
  .s-warn { color: var(--warn); background: var(--warn-soft); }
  .s-bad { color: var(--bad); background: var(--bad-soft); }
  .s-info { color: var(--info); background: var(--info-soft); }
  .s-prop { color: var(--proposal); background: var(--proposal-soft); }
  .s-plain { color: var(--text-2); background: var(--surface-3); }
  /* Opaque soft tints for the header status button: the soft token composited over bg, without alpha (same fix as ticket 08). */
  :root { --bad-soft-solid: color-mix(in srgb, rgb(240 127 127) 12%, var(--bg)); }
  :root[data-theme="light"] { --bad-soft-solid: color-mix(in srgb, rgb(207 60 60) 8%, var(--bg)); }
  button.status.s-bad { background: var(--bad-soft-solid); }
  button.status:hover { background: var(--surface-hover); }

  .banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
  .banner .msg { flex: 1 1 320px; min-width: 0; }
  .banner-warn > svg.i:first-child { color: var(--warn); }
  .banner-bad > svg.i:first-child { color: var(--bad); }
  .banner-info > svg.i:first-child { color: var(--info); }

  .work-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .target-line { display: flex; gap: 12px; flex-wrap: wrap; color: var(--text-2); font-size: 13px; margin-top: 6px; }
  .target-line span { display: inline-flex; gap: 6px; align-items: center; }
  .head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab { min-height: 36px; padding: 0 12px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--text-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--brand); }
  .count { font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); }
  .count.bad { background: var(--bad-soft); color: var(--bad); }

  .region { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; display: flex; flex-direction: column; }
  .region > * { min-width: 0; }
  .region-bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .region-bar .grow { flex: 1; }
  .sec-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }

  /* Filters */
  .filter { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px; border: 1px solid var(--control-border); border-radius: var(--radius); background: var(--surface); cursor: pointer; font-size: 13px; }
  .filter:hover { background: var(--surface-hover); }
  .filter .v { color: var(--text); font-weight: 500; }
  .filter .k { color: var(--text-2); }
  .search { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px; border: 1px solid var(--control-border); border-radius: var(--radius); background: var(--surface); color: var(--text-2); }
  .search input { border: 0; background: none; outline: none; width: 180px; color: var(--text); font-size: 13px; }
  .search:focus-within { outline: 2px solid var(--ring); outline-offset: 2px; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
  .switch button { width: 36px; height: 20px; border-radius: 999px; border: 1px solid var(--control-border); background: var(--surface-3); position: relative; padding: 0; cursor: pointer; }
  .switch button::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 999px; background: var(--text-2); }
  .switch button[aria-checked="true"] { background: var(--brand); border-color: var(--brand); }
  .switch button[aria-checked="true"]::after { left: 18px; background: var(--brand-ink); }

  /* Tables */
  .tscroll { overflow-x: auto; position: relative; }
  table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
  .t th { text-align: left; font-weight: 500; font-size: 12px; color: var(--text-2); padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
  .t td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .t tbody tr:hover td { background: var(--surface-hover); }
  .t tr.selected td { background: var(--brand-soft); }
  .t .chk { width: 32px; }
  .t input[type="checkbox"] { width: 24px; height: 24px; accent-color: var(--brand); margin: -4px 0 0; }
  .t .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .clip { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acts { display: flex; gap: 6px; white-space: nowrap; }
  .t-proposals { min-width: 940px; }
  .t .stick { position: sticky; right: 0; background: var(--surface); box-shadow: -1px 0 0 var(--line); }
  .t th.stick { background: var(--surface-2); }
  .t tbody tr:hover td.stick { background: var(--surface-hover); }
  .t tr.selected td.stick { background: var(--surface-3); }
  .t-log { min-width: 1080px; }
  .t-grid { min-width: 860px; }
  .t-grid td { height: 36px; padding: 0 10px; vertical-align: middle; white-space: nowrap; }
  .rowerr td { background: var(--surface); padding-top: 0; }
  .inline-err { max-width: 640px; white-space: normal; display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
  .inline-err > svg.i { color: var(--bad); margin-top: 2px; }
  .inline-err.warn > svg.i { color: var(--warn); }
  .val { font-family: var(--font-code); font-size: 12px; }
  .footer-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; flex-wrap: wrap; }

  /* Questions */
  .qcards { display: flex; flex-direction: column; gap: 12px; padding: 12px; }
  .qcard { border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface-2); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .qmeta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
  .qtext { font-size: 15px; font-weight: 500; max-width: 72ch; }
  fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .opt { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; padding: 6px 8px; border-radius: var(--radius); cursor: pointer; }
  .opt:hover { background: var(--surface-hover); }
  .opt input { margin: 3px 0 0; accent-color: var(--brand); width: 16px; height: 16px; }
  .opt .eff { grid-column: 2; font-size: 12px; color: var(--text-2); }
  .qfoot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .reason { font-size: 13px; color: var(--text-2); max-width: 80ch; }
  details.answered { padding: 0 12px 12px; }
  details.answered summary { cursor: pointer; color: var(--text-2); padding: 6px 0; }

  /* Compare + pane */
  .body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .pane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .pane-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pcard { border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface-2); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .pcard .change { font-size: 15px; font-weight: 500; }
  .kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 10px; font-size: 13px; }
  .kv dt { color: var(--text-2); } .kv dd { margin: 0; }
  .tip { position: absolute; z-index: 6; background: var(--surface-3); border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: var(--shadow-md); white-space: nowrap; }
  @media (min-width: 1280px) { .body.has-pane { grid-template-columns: minmax(0, 1fr) 360px; } }
  @media (max-width: 1279.98px) {
    .body.has-pane .pane { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 92vw); border-radius: 0; box-shadow: var(--shadow-lg); z-index: 20; overflow-y: auto; }
  }

  /* Notice and toast */
  .notice { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); font-size: 13px; }
  .toast { position: fixed; right: 24px; bottom: 24px; max-width: 420px; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface-3); box-shadow: var(--shadow-lg); z-index: 30; }
  .toast > svg.i { color: var(--warn); margin-top: 2px; }

  /* Dialog */
  .scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.55); z-index: 40; display: grid; place-items: center; padding: 24px; }
  .dialog { width: min(560px, 100%); max-height: calc(100vh - 48px); overflow-y: auto; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .dialog h2 { font-size: 18px; }
  .sumgrid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; font-size: 13px; }
  .sumgrid .n { text-align: right; font-variant-numeric: tabular-nums; }
  .plancmp { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 12px; align-items: center; font-size: 13px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .skipped { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .skipped li { display: flex; gap: 8px; align-items: flex-start; }
  .dfoot { display: flex; justify-content: flex-end; gap: 8px; }
  .empty { margin: 40px auto; max-width: 460px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .empty svg.i { width: 28px; height: 28px; color: var(--text-3); }
  .empty h2 { font-size: 20px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const P = {
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  check: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  x: '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>',
  bot: '<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>',
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  chev: '<path d="m9 18 6-6-6-6"/>', down: '<path d="m6 9 6 6 6-6"/>',
  more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  merge: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/>',
  db: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/>',
  file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  close: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  swap: '<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/>',
  msg: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
};
const I = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const st = (cls, icon, text) => `<span class="status ${cls}">${I(icon)}${text}</span>`;
const q = new URLSearchParams(location.search);
const screen = q.get('screen') || 'agent';
document.documentElement.dataset.theme = q.get('theme') || 'dark';

const navItems = ['Overview', 'Search', 'Graph', 'Inspector', 'Review queue', 'Development Center', 'Settings'];
const sidebar = `<aside class="sidebar"><div class="brand">PBIBrain</div><nav aria-label="Main navigation">${navItems.map(n => `<button class="nav" ${n === 'Development Center' ? 'aria-current="page"' : ''}>${n === 'Development Center' ? I('merge') : ''}<span>${n}</span></button>`).join('')}</nav></aside>`;
const crumbs = (tab) => `<header class="topbar"><nav aria-label="Breadcrumb" style="display:flex;align-items:center;gap:2px;min-width:0"><button class="crumb">Development Center</button>${I('chev')}<button class="crumb">Sales master merge</button>${I('chev')}<span class="crumb-now" aria-current="page">${tab}</span></nav></header>`;
const empty = q.get('empty') === '1';
const tabsDef = [['Compare'], ['Impact'], ['Plan', '2', true], ['Agent', empty ? '' : '9'], ['Sources'], ['Log']];
const head = (tab) => `<div class="work-head"><div><h1>Sales master merge</h1><div class="target-line"><span>${I('db')}Target model: Sales Master</span><span>${I('file')}Target report: new empty report</span></div></div>
  <div class="head-actions"><button class="status s-bad" style="border:0;min-height:28px;cursor:pointer">${I('x')}Plan not valid: 2 blocking</button><button class="btn">${I('refresh')}Check sources</button><button class="btn" aria-label="More actions">${I('more')}</button></div></div>
  <div class="tabs" role="tablist" aria-label="Session views">${tabsDef.map(([t, c, bad]) => `<button class="tab" role="tab" aria-selected="${t === tab}" ${t === tab ? 'aria-controls="tp"' : 'tabindex="-1"'}>${t}${c ? `<span class="count ${bad ? 'bad' : ''}">${c}<span class="sr"> ${bad ? 'blocking' : 'open'}</span></span>` : ''}</button>`).join('')}</div>`;

const props = [
  { id: 'p1', kind: 'Merge Choice', target: '[Net Margin]', change: 'Keep from Sales B', conf: 96, reason: 'Sales B divides by net revenue. The other sources divide by gross revenue, and the target report labels it "net".', from: 'Claude Desktop', when: '10:41', status: 'ready' },
  { id: 'p2', kind: 'Name', target: 'Sales[amt_net]', change: 'Rename to Net Amount', conf: 93, reason: 'Confirmed rule R2: columns use title case words.', from: 'Claude Desktop', when: '10:41', status: 'ready' },
  { id: 'p3', kind: 'Alignment', target: '[Total Sales] and [Sales Total]', change: 'Match as one row', conf: 95, reason: 'Same DAX after rename. Same format string.', from: 'Claude Desktop', when: '10:40', status: 'ready' },
  { id: 'p4', kind: 'Removal policy', target: 'Customer[Region Old]', change: 'Repoint to Customer[Region]', conf: 91, reason: '3 visuals use it. Customer[Region] has the same values.', from: 'Claude Desktop', when: '10:39', status: 'ready' },
  { id: 'p5', kind: 'Merge Choice', target: '[YoY %]', change: 'Keep from Sales A', conf: 92, reason: 'Sales A uses the marked date table.', from: 'Cursor', when: '10:35', status: 'source' },
  { id: 'p6', kind: 'Merge Choice', target: 'Product[Category]', change: 'Keep from Finance (cloud)', conf: 90, reason: 'Finance has the full category list.', from: 'Cursor', when: '10:33', status: 'conflict', yours: 'Keep from Sales A' },
  { id: 'p7', kind: 'Need mapping', target: 'Date table', change: 'Map to Date in Sales Master', conf: 97, reason: 'Same columns and the same mark as date table.', from: 'Claude Desktop', when: '10:30', status: 'ready' },
];
const statusEl = (s) => s === 'ready' ? st('s-prop', 'bot', 'Ready to accept') : s === 'source' ? st('s-warn', 'alert', 'Confirm row first') : st('s-warn', 'swap', 'Conflicts with your choice');

function proposalsTable(opts = {}) {
  const sel = opts.sel || [];
  return `<div class="tscroll" tabindex="0" aria-label="Agent proposals, scroll area"><table class="t t-proposals"><caption class="sr">Open agent proposals</caption><thead><tr>
  <th class="chk"><input type="checkbox" aria-label="Select all shown proposals" ${sel.length ? 'checked' : ''}></th><th scope="col">Target</th><th scope="col">Proposed change</th><th scope="col">Confidence</th><th scope="col">Reason</th><th scope="col">From</th><th scope="col">Status</th><th scope="col" class="stick"><span class="sr">Actions</span></th></tr></thead><tbody>
  ${props.map(p => {
    const isSel = sel.includes(p.id);
    const err = opts.errFor === p.id;
    const row = `<tr class="${isSel ? 'selected' : ''}"><td class="chk"><input type="checkbox" aria-label="Select proposal for ${p.target}" ${isSel ? 'checked' : ''} ${p.status !== 'ready' ? 'disabled' : ''}></td>
    <td><div class="small muted">${p.kind}</div><button class="link">${p.target}</button></td><td>${p.change}${p.yours ? `<div class="small muted">Your choice: ${p.yours}</div>` : ''}</td>
    <td class="num">${p.conf}%</td><td><div class="clip muted">${p.reason}</div></td><td class="small muted" style="white-space:nowrap">${p.from}<br>${p.when}</td><td>${statusEl(p.status)}</td>
    <td class="stick"><div class="acts">${p.status === 'source' ? `<button class="btn btn-sm">Open row</button>` : `<button class="btn btn-sm btn-primary" ${opts.loading === p.id ? 'disabled' : ''}>${opts.loading === p.id ? 'Accepting' : p.status === 'conflict' ? 'Replace with agent choice' : 'Accept'}</button>`}<button class="btn btn-sm">Reject</button></div></td></tr>`;
    const errRow = err ? `<tr class="rowerr"><td></td><td colspan="7"><div class="inline-err ${opts.errKind === 'source' ? 'warn' : ''}" role="alert">${I('alert')}<span>${ERR[opts.errKind]}</span>${opts.errKind === 'source' ? '<button class="btn btn-sm" style="margin-left:auto">Open row</button>' : ''}</div></td></tr>` : '';
    return row + errRow;
  }).join('')}
  </tbody></table></div>`;
}
const ERR = {
  stale: 'This session changed in another place. The view shows the latest state. Do the action again.',
  choice: 'You already set a Merge Choice on this row. Change the choice in the row detail, or reject the proposal.',
  source: 'A source of this row changed after the agent made this proposal. Confirm the row first, then accept or reject the proposal.',
};

const question = (answer) => `<article class="qcard" aria-labelledby="q1t">
  <div class="qmeta">${st('s-prop', 'msg', 'Question from agent')}<span>Claude Desktop, 10:42</span><span>Row: <button class="link">[Total Sales]</button></span></div>
  <p class="qtext" id="q1t">Sales B and Finance (cloud) have different [Total Sales]. Sales B uses Sales[Net]. Finance uses Sales[Gross]. Which one do you keep?</p>
  <fieldset><legend class="sr">Options</legend>
    <label class="opt"><input type="radio" name="q1" ${answer === 2 ? '' : 'checked'}><span>Keep from Sales B (Sales[Net]) ${st('s-plain', 'check', 'Recommended')}</span><span class="eff">Sets Merge Choice: Keep from Sales B</span></label>
    <label class="opt"><input type="radio" name="q1" ${answer === 2 ? 'checked' : ''}><span>Keep from Finance (cloud) (Sales[Gross])</span><span class="eff">Sets Merge Choice: Keep from Finance (cloud)</span></label>
    <label class="opt"><input type="radio" name="q1"><span>Keep both, rename the Finance version to [Total Sales Gross]</span><span class="eff">Sets Merge Choice: Keep both, and a name</span></label>
  </fieldset>
  <p class="reason"><span class="muted">Reason: </span>The target report labels the visual "Net sales", but Finance is the newer source. Confidence was 0.72, below the 0.9 limit.</p>
  <div class="qfoot"><button class="btn btn-primary">Answer</button><button class="btn btn-ghost">Open row</button></div>
</article>`;

function agentTab() {
  if (empty) return `<div class="region" id="tp" role="tabpanel"><div class="region-bar"><span class="grow"></span><span class="small muted">Last check 10:44</span><button class="btn btn-sm">${I('refresh')}Refresh</button></div>
    <div class="empty">${I('bot')}<h2>No open proposals or questions</h2><p class="muted">When an agent connected through MCP proposes a change or asks a question, it shows here. Nothing changes until you accept it.</p></div></div>`;
  const sel = q.get('sel') === '1' ? ['p1', 'p2', 'p7'] : [];
  const errKind = q.get('err');
  const notice = q.get('new') === '1' ? `<div class="notice" role="status">${I('bot')}<span>3 new proposals.</span><button class="link">Show them</button></div>` : '';
  return `<div class="region" id="tp" role="tabpanel">
  ${notice}
  <section aria-labelledby="qh"><div class="region-bar"><h2 id="qh">Questions</h2><span class="count">2<span class="sr"> open</span></span><span class="grow"></span><span class="small muted">Last check 10:44</span><button class="btn btn-sm">${I('refresh')}Refresh</button></div>
  <div class="qcards">${question()}<p class="small muted">1 more open question. <button class="link">Show it</button></p></div>
  <details class="answered"><summary>Answered (3)</summary></details></section>
  <section aria-labelledby="ph" style="border-top:1px solid var(--line)"><div class="region-bar"><h2 id="ph">Proposals</h2><span class="count">7<span class="sr"> open</span></span>
    <button class="filter"><span class="k">Kind</span><span class="v">All</span>${I('down')}</button><button class="filter"><span class="k">Status</span><span class="v">All</span>${I('down')}</button>
    <label class="search">${I('search')}<span class="sr">Search target</span><input type="search" placeholder="Search target"></label>
    <span class="grow"></span>
    <button class="btn btn-sm" ${sel.length ? '' : 'disabled'}>Accept selected${sel.length ? ` (${sel.length})` : ''}</button><button class="btn btn-sm btn-primary">Accept all</button></div>
  ${proposalsTable({ sel, errFor: errKind ? { stale: null, choice: 'p6', source: 'p5' }[errKind] : null, errKind, loading: q.get('loading') === '1' ? 'p1' : null })}
  <div class="footer-row small muted"><span>Showing 7 of 7. Sort: newest first.</span></div></section>
  </div>
  ${errKind === 'stale' ? `<div class="toast" role="alert">${I('alert')}<span>${ERR.stale}</span><button class="btn btn-ghost btn-sm" aria-label="Close message">${I('close')}</button></div>` : ''}`;
}

function acceptAllDialog() {
  return `<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dt">
  <h2 id="dt">Accept 5 agent proposals?</h2>
  <p class="muted">Each proposal becomes your Merge Choice, name, or mapping. Apply then uses them. Nothing is written to the files until you apply the plan.</p>
  <div><h3 style="margin-bottom:6px">Proposals to accept</h3><div class="sumgrid"><span>Merge Choice</span><span class="n">1</span><span>Name</span><span class="n">1</span><span>Alignment</span><span class="n">1</span><span>Removal policy</span><span class="n">1</span><span>Need mapping</span><span class="n">1</span></div></div>
  <div><h3 style="margin-bottom:6px">Effect on the plan</h3><div class="plancmp"><span class="muted">Now</span><span>${st('s-bad', 'x', 'Not valid: 2 blocking')}</span><span class="muted">After accept</span><span>${st('s-warn', 'alert', 'Valid with 3 warnings')}</span><span class="muted">Change</span><span>2 fewer blocking items, 1 more warning</span></div></div>
  <div><h3 style="margin-bottom:6px">Skipped (2)</h3><ul class="skipped">
    <li>${I('alert')}<span>[YoY %]: a source changed. Confirm the row first.</span></li>
    <li>${I('swap')}<span>Product[Category]: you already set a Merge Choice. Decide in the row detail.</span></li></ul></div>
  <div class="dfoot"><button class="btn">Cancel</button><button class="btn btn-primary">Accept 5 proposals</button></div>
  </div></div>`;
}

function compareTab() {
  const variant = q.get('card') || 'plain';
  const rows = [
    ['[Total Sales]', 'Measure', 'Same', 'Different', 'Different', 'Not set', 'q'],
    ['[Net Margin]', 'Measure', 'Same', 'Different', 'Same', 'Not set', 'p'],
    ['Sales[Amount]', 'Column', 'Same', 'Same', 'Same', 'Keep target', ''],
    ['[YoY %]', 'Measure', 'Changed', 'Same', 'Missing', 'Keep from Sales A', 'ps'],
    ['Product[Category]', 'Column', 'Same', 'Different', 'Different', 'Keep from Sales A', 'p'],
    ['Customer', 'Table', 'Same', 'Same', 'Only here', 'Keep target', ''],
  ];
  const cell = (r) => {
    let m = `<span class="${r[5] === 'Not set' ? 'muted' : ''}">${r[5]}</span>`;
    if (r[6].includes('s')) return m + ` <span class="status s-warn" tabindex="0" title="Confirm row first. Agent proposes: Keep from Sales A">${I('alert')}Confirm row first</span>`;
    if (r[6].includes('p')) m += ` <span class="status s-prop" tabindex="0" aria-describedby="tip-${r[0].length}" title="Agent proposes: ${r[0] === '[Net Margin]' ? 'Keep from Sales B' : 'Keep from Finance (cloud)'}">${I('bot')}Proposed</span>`;
    if (r[6].includes('q')) m += ` <span class="status s-prop">${I('msg')}Question</span>`;
    return m;
  };
  const sel = variant === 'source' ? 3 : variant === 'conflict' ? 4 : 1;
  const grid = `<div class="region" id="tp" role="tabpanel"><div class="region-bar"><span class="muted small">Compare grid placeholder (ticket 03). Only the Merge Choice cell content is from ticket 06.</span></div>
  <div class="tscroll" style="position:relative" tabindex="0" aria-label="Compare rows, scroll area"><table class="t t-grid"><thead><tr><th>Object</th><th>Type</th><th>Sales A</th><th>Sales B</th><th>Finance (cloud)</th><th>Merge Choice</th></tr></thead><tbody>
  ${rows.map((r, i) => `<tr class="${i === sel ? 'selected' : ''}"><td>${r[0]}</td><td class="muted">${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${cell(r)}</td></tr>`).join('')}
  </tbody></table>${variant === 'plain' && q.get('tip') === '1' ? `<div class="tip" role="tooltip" style="left:560px;top:84px">Agent proposes: Keep from Sales B</div>` : ''}</div></div>`;
  const card = {
    plain: { t: '[Net Margin]', change: 'Keep from Sales B', conf: '96%', reason: props[0].reason, from: 'Claude Desktop, today 10:41', yours: null, acts: `<button class="btn btn-primary">Accept</button><button class="btn">Reject</button>` },
    conflict: { t: 'Product[Category]', change: 'Keep from Finance (cloud)', conf: '90%', reason: props[5].reason, from: 'Cursor, today 10:33', yours: 'Keep from Sales A', acts: `<button class="btn btn-primary">Replace with agent choice</button><button class="btn">Reject</button>` },
    source: { t: '[YoY %]', change: 'Keep from Sales A', conf: '92%', reason: props[4].reason, from: 'Cursor, today 10:35', yours: null, acts: `<button class="btn btn-primary" disabled>Accept</button><button class="btn">Reject</button>`, warn: true },
  }[variant];
  const pane = `<aside class="pane" aria-label="Row detail"><div class="pane-head"><h2>${card.t}</h2><button class="btn btn-ghost" aria-label="Close row detail">${I('close')}</button></div>
  <section class="pcard" aria-labelledby="pct"><div class="qmeta">${st('s-prop', 'bot', 'Proposed by agent')}<span id="pct">${card.from}</span></div>
  <p class="change">${card.change}</p>
  <dl class="kv">${card.yours ? `<dt>Your choice</dt><dd>${card.yours}</dd>` : ''}<dt>Confidence</dt><dd>${card.conf}</dd><dt>Reason</dt><dd>${card.reason}</dd></dl>
  ${card.warn ? `<div class="inline-err warn" role="status">${I('alert')}<span>A source of this row changed after the agent made this proposal. Confirm the row first, then accept or reject the proposal.</span></div><div><button class="btn">Confirm row</button></div>` : ''}
  <div class="qfoot">${card.acts}</div></section>
  <p class="small muted">Row detail content below the card is ticket 04.</p></aside>`;
  return `<div class="body has-pane">${grid}${pane}</div>`;
}

function planTab() {
  const on = q.get('inc') === '1';
  return `<div class="region" id="tp" role="tabpanel"><div class="region-bar"><span class="muted small">Plan tab placeholder (ticket 08).</span><span class="grow"></span>
  <span class="switch"><button role="switch" aria-checked="${on}" aria-labelledby="swl"></button><span id="swl">Include open proposals</span></span></div>
  <div style="padding:12px;display:flex;flex-direction:column;gap:12px">${on ? `<div class="banner banner-info" role="status">${I('info')}<span class="msg">This view includes 7 open agent proposals. Apply uses only accepted choices.</span></div>` : ''}
  <p>${on ? st('s-warn', 'alert', 'Valid with 3 warnings') : st('s-bad', 'x', 'Not valid: 2 blocking')} <span class="muted small">${on ? 'With open proposals' : 'Accepted choices only'}</span></p></div></div>`;
}

const logRows = [
  ['10:44:12', 'you', 'Accepted proposal', '[Net Margin]', 'Not set', 'Keep from Sales B', 'Accepted agent proposal', 'P-0007'],
  ['10:43:50', 'you', 'Rejected proposal', 'Sales[qty]', 'Quantity (proposed)', 'No change', '', 'P-0006'],
  ['10:42:03', 'agent', 'Asked question', '[Total Sales]', '', '3 options', 'Confidence was 0.72, below the 0.9 limit.', ''],
  ['10:41:30', 'agent', 'Proposed Merge Choice', '[Net Margin]', 'Not set', 'Keep from Sales B', 'Sales B divides by net revenue. The other sources divide by gross revenue.', 'P-0007'],
  ['10:40:11', 'agent', 'Proposed alignment', '[Total Sales] and [Sales Total]', 'Two rows', 'One row', 'Same DAX after rename. Same format string.', 'P-0005'],
  ['10:21:47', 'you', 'Set Merge Choice', 'Product[Category]', 'Not set', 'Keep from Sales A', '', ''],
  ['10:05:02', 'you', 'Checked sources', 'Session', '', '2 sources changed', '', ''],
  ['09:58:40', 'you', 'Added source', 'Finance (cloud)', '', 'Cloud model, Read', '', ''],
];
function logTab() {
  const filtered = q.get('pf') === '1';
  const rows = filtered ? logRows.filter(r => r[7] === 'P-0007') : logRows;
  return `<div class="region" id="tp" role="tabpanel"><div class="region-bar"><h2>Session log</h2><span class="grow"></span>
    <button class="filter"><span class="k">Author</span><span class="v">All</span>${I('down')}</button><button class="filter"><span class="k">Action</span><span class="v">All</span>${I('down')}</button>
    <label class="search">${I('search')}<span class="sr">Search target</span><input type="search" placeholder="Search target"></label>
    ${filtered ? `<span class="status s-plain">Proposal P-0007 <button class="btn btn-ghost" style="min-height:24px;padding:0 4px" aria-label="Clear proposal filter">${I('close')}</button></span>` : ''}</div>
  <div class="tscroll" tabindex="0" aria-label="Session log, scroll area"><table class="t t-log"><caption class="sr">Session log, newest first</caption><thead><tr><th scope="col">Time</th><th scope="col">Author</th><th scope="col">Action</th><th scope="col">Target</th><th scope="col">Before</th><th scope="col">After</th><th scope="col">Reason</th><th scope="col">Proposal</th></tr></thead><tbody>
  ${rows.map(r => `<tr><td class="num muted">Today ${r[0]}</td><td style="white-space:nowrap">${r[1] === 'you' ? `${I('user')} You` : `${I('bot')} Agent: Claude Desktop`}</td><td>${r[2]}</td><td><button class="link">${r[3]}</button></td><td class="val">${r[4] || '<span class="muted">None</span>'}</td><td class="val">${r[5]}</td><td><div class="clip muted">${r[6] || '<span class="muted">None</span>'}</div></td><td>${r[7] ? `<button class="link code">${r[7]}</button>` : ''}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="footer-row"><span class="small muted">Showing ${rows.length} entries.</span>${filtered ? '' : '<button class="btn btn-sm">Show more</button>'}</div></div>`;
}

const tab = { agent: 'Agent', acceptall: 'Agent', compare: 'Compare', plan: 'Plan', log: 'Log' }[screen] || 'Agent';
let body = screen === 'compare' ? compareTab() : screen === 'plan' ? planTab() : screen === 'log' ? logTab() : agentTab();
document.getElementById('app').innerHTML = `<div class="shell">${sidebar}<div class="main">${crumbs(tab)}<main class="content" id="main">${head(tab)}${body}</main></div></div>${screen === 'acceptall' ? acceptAllDialog() : ''}`;
</script>
</body>
</html>
