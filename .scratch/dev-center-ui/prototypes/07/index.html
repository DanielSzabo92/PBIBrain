<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud sources and rules</title>
<!-- Prototype for ticket 07. Never shipped. Open with ?screen=<id>&theme=dark|light. Screen IDs are in SCREENS below. -->
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

  .shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
  .sidebar { background: var(--bg-sidebar); border-right: 1px solid var(--line); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; }
  .brand { font-weight: 600; padding: 4px 10px 16px; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 0 10px; min-height: 32px; border-radius: var(--radius); color: var(--text-2); border: 0; background: none; text-align: left; cursor: pointer; }
  .nav:hover { background: var(--surface-hover); color: var(--text); }
  .nav[aria-current="page"] { background: var(--surface-3); color: var(--text); }
  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 20px; border-bottom: 1px solid var(--line); color: var(--text-2); min-width: 0; }
  .content { padding: 24px; min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 16px; }

  h1 { font-size: 28px; line-height: 1.2; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  h2 { font-size: 16px; margin: 0; font-weight: 600; }
  h3 { font-size: 14px; margin: 0; font-weight: 600; }
  p { margin: 0; }
  .muted { color: var(--text-2); }
  .small { font-size: 12px; }
  .code { font-family: var(--font-code); font-size: 12px; }

  .btn { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--control-border); background: var(--surface); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--surface-hover); }
  .btn:active { background: var(--surface-3); }
  .btn:disabled, .btn[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; }
  .btn-primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .btn-primary:hover { background: var(--brand-strong); border-color: var(--brand-strong); }
  .btn-ghost { border-color: transparent; background: none; }
  .btn-sm { min-height: 28px; padding: 0 8px; font-size: 13px; }
  .btn-danger { color: var(--bad); }
  .btn-danger-fill { background: var(--bad); color: var(--text-inverse); border-color: var(--bad); }
  .btn-danger-fill:hover { background: color-mix(in srgb, var(--bad) 88%, var(--text)); border-color: color-mix(in srgb, var(--bad) 88%, var(--text)); }
  .link { background: none; border: 0; padding: 0; color: var(--brand); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; min-height: 24px; }

  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .s-ok { color: var(--ok); background: var(--ok-soft); }
  .s-warn { color: var(--warn); background: var(--warn-soft); }
  .s-bad { color: var(--bad); background: var(--bad-soft); }
  .s-info { color: var(--info); background: var(--info-soft); }
  .s-plain { color: var(--text-2); background: var(--surface-3); }
  .status svg.i { width: 14px; height: 14px; }

  .banner { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
  .banner .msg { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .banner > svg.i { margin-top: 2px; }
  .banner-warn > svg.i { color: var(--warn); } .banner-bad > svg.i { color: var(--bad); } .banner-info > svg.i { color: var(--info); }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab { min-height: 36px; padding: 0 12px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--text-2); display: inline-flex; align-items: center; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--brand); }

  .section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
  .section-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .section-head .t { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 320px; }
  .section-body { padding: 12px 16px; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .toolbar .grow { flex: 1; }

  .src-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .src-row:last-child { border-bottom: 0; }
  .src-path { font-family: var(--font-code); font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .seg { display: inline-flex; border: 1px solid var(--control-border); border-radius: var(--radius); overflow: hidden; }
  .seg button { border: 0; background: none; min-height: 28px; padding: 0 10px; cursor: pointer; color: var(--text-2); }
  .seg button:hover { color: var(--text); background: var(--surface-hover); }
  .seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); }

  .table-wrap { overflow-x: auto; }
  .rules { width: 100%; border-collapse: collapse; min-width: 760px; font-size: 13px; }
  .rules td.rule-text { min-width: 240px; }
  .rules th:last-child, .rules td:last-child { position: sticky; right: 0; background: var(--surface); }
  .rules tr.group td:last-child, .rules th:last-child { background: var(--surface-2); }
  .rules th { text-align: left; font-weight: 500; font-size: 12px; color: var(--text-2); padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
  .rules td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .rules tr.group td { background: var(--surface-2); font-weight: 600; font-size: 12px; color: var(--text-2); padding: 6px 12px; }
  /* Opaque form of brand-soft over surface (same rendered color; the states gate drops alpha). */
  :root { --sel-row: color-mix(in srgb, var(--brand) 12%, var(--surface)); }
  :root[data-theme="light"] { --sel-row: color-mix(in srgb, var(--brand) 9%, var(--surface)); }
  .rules tr.sel td, .rules tr.sel td:last-child { background: var(--sel-row); }
  .rules tr.rejected td.rule-text { color: var(--text-2); }
  .rules td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rules .acts { display: flex; gap: 4px; justify-content: flex-end; white-space: nowrap; }
  .rules input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--brand); margin: 0; }
  .breaks-warn { color: var(--warn); display: inline-flex; gap: 4px; align-items: center; }

  .body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .pane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; align-self: start; }
  .pane-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pane-foot { display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
  @media (min-width: 1280px) { .body.has-pane { grid-template-columns: minmax(0, 1fr) 360px; } }
  @media (max-width: 1279.98px) {
    .body.has-pane .pane { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 92vw); border-radius: 0; box-shadow: var(--shadow-lg); z-index: 20; overflow-y: auto; }
  }

  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field label, .field .lbl { font-weight: 500; font-size: 13px; }
  .field .help { font-size: 12px; color: var(--text-2); }
  .field .err { font-size: 12px; color: var(--bad); display: flex; gap: 6px; align-items: flex-start; }
  .input { min-height: 32px; padding: 0 10px; border-radius: var(--radius); border: 1px solid var(--control-border); background: var(--surface); color: var(--text); width: 100%; min-width: 0; }
  .input[aria-invalid="true"] { border-color: var(--bad); }
  .trigger { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; padding: 0 10px; border-radius: var(--radius); border: 1px solid var(--control-border); background: var(--surface); cursor: pointer; width: 100%; text-align: left; }
  .trigger:hover { background: var(--surface-hover); }
  .trigger svg.i { color: var(--text-2); }
  .combo { position: relative; }
  .combo .input { padding-right: 32px; }
  .combo svg.i { position: absolute; right: 10px; top: 8px; color: var(--text-2); pointer-events: none; }
  .preview { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; font-size: 13px; }

  fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  legend { font-weight: 600; margin-bottom: 8px; padding: 0; }
  .radio { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 4px 8px; padding: 8px 10px; border-radius: var(--radius); border: 1px solid transparent; }
  .radio:hover { background: var(--surface-hover); }
  .radio.checked { border-color: var(--brand-line); background: var(--brand-soft); }
  .radio input { margin: 3px 0 0; accent-color: var(--brand); width: 16px; height: 16px; }
  .radio .desc { grid-column: 2 / 4; font-size: 12px; color: var(--text-2); }
  .radio .meta { font-size: 12px; color: var(--text-2); white-space: nowrap; }
  .radio.disabled { color: var(--text-3); }
  .radio.disabled:hover { background: none; }
  .radio .why { grid-column: 2 / 4; font-size: 12px; color: var(--text-2); display: flex; gap: 6px; align-items: flex-start; }
  .radio .why svg.i { width: 14px; height: 14px; margin-top: 1px; }

  /* Dialog */
  .scrim { position: fixed; inset: 0; background: var(--minimap-mask); z-index: 30; display: grid; place-items: center; padding: 16px; }
  .dialog { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: var(--shadow-lg); width: min(640px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; min-width: 0; }
  .dialog.sm { width: min(480px, 100%); }
  .d-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 20px 12px; }
  .d-head h2 { font-size: 18px; }
  .d-body { padding: 4px 20px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .d-foot { display: flex; justify-content: space-between; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .d-foot .right { display: flex; gap: 8px; margin-left: auto; }
  .steps { display: flex; gap: 4px 16px; list-style: none; margin: 0; padding: 0 20px 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .step { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 13px; }
  .step b { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 999px; border: 1px solid var(--control-border); font-weight: 500; font-size: 12px; }
  .step[aria-current="step"] { color: var(--text); }
  .step[aria-current="step"] b { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .step.done b { color: var(--ok); border-color: var(--ok); }
  .account { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); }
  .account b { color: var(--text); font-weight: 500; }
  .center { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 20px 12px; }
  .center > svg.i { width: 28px; height: 28px; color: var(--text-3); }
  .center p { max-width: 440px; }

  .checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); }
  .checks li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 2px 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .checks li:last-child { border-bottom: 0; }
  .checks .k { font-weight: 500; }
  .checks .d { grid-column: 2; font-size: 12px; color: var(--text-2); }
  .checks svg.i { margin-top: 2px; }
  .ok-c { color: var(--ok); } .bad-c { color: var(--bad); } .warn-c { color: var(--warn); } .run-c { color: var(--info); } .nc-c { color: var(--text-2); }
  .group-label { font-size: 12px; font-weight: 600; color: var(--text-2); }
  .empty { padding: 32px 16px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
  .empty svg.i { width: 28px; height: 28px; color: var(--text-3); }
  .rowmenu { position: fixed; top: 380px; right: 40px; z-index: 25; min-width: 180px; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: var(--shadow-md); padding: 4px; display: flex; flex-direction: column; }
  .mi { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 10px; background: none; border: 0; border-radius: 6px; text-align: left; cursor: pointer; }
  .mi:hover { background: var(--surface-hover); }
  .toast { position: fixed; bottom: 16px; right: 16px; background: var(--surface-3); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 10px 14px; box-shadow: var(--shadow-md); display: flex; gap: 8px; align-items: center; z-index: 40; max-width: min(420px, 92vw); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const q = new URLSearchParams(location.search);
document.documentElement.dataset.theme = q.get('theme') === 'light' ? 'light' : 'dark';
const S = q.get('screen') || 'rules';

const P = {
  check: '<path d="M20 6 9 17l-5-5"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  xc: '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>',
  okc: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  warn: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  nc: '<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  load: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
  cloud: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
  folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  db: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>',
  file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
  user: '<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  copy: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  down: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  pen: '<path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  tag: '<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5"/>',
  dash: '<circle cx="12" cy="12" r="10" stroke-dasharray="4 3"/>',
  merge: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/>',
  more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  undo: '<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>',
};
const I = (n, c = '') => `<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const st = (cls, icon, text) => `<span class="status ${cls}">${I(icon)}${text}</span>`;

/* ---------- Background: work area, Sources tab ---------- */
const locked = S === 'rules-locked';
const dis = locked ? ' disabled' : '';
function sourcesSection() {
  const row = (icon, name, kind, path, status, acts) => `
    <div class="src-row">${I(icon)}<div style="min-width:0"><div>${name} <span class="muted small">${kind}</span></div><div class="src-path">${path}</div></div>
    ${status}<span class="muted small">${acts[0]}</span><div style="display:flex;gap:4px">${acts[1]}</div></div>`;
  return `<section class="section" aria-labelledby="h-src">
    <div class="section-head"><div class="t"><h2 id="h-src">Sources</h2><p class="muted small">Each source stays read-only. PBIBrain writes only to the target.</p></div>
      <button class="btn"${dis}>${I('plus')}Add source ${I('chev')}</button></div>
    <div class="section-body">
      ${row('folder', 'Sales A', 'PBIP project, TMDL', 'models/SalesA/SalesA.SemanticModel', st('s-ok', 'check', 'Read'), ['Donor', ''])}
      ${row('cloud', 'Sales Cloud', 'Cloud model', 'Workspace: Sales Analytics', st('s-ok', 'check', 'Read'), ['Access: Read', `<button class="btn btn-sm"${dis}>${I('down')}Pull to local PBIP</button>`])}
      ${row('file', 'Region KPIs', 'Cloud report', 'Workspace: Sales Analytics', st('s-plain', 'nc', 'Not checked'), ['Access: Read', ''])}
    </div></section>`;
}
function workFrame(inner, opts = {}) {
  return `<div class="shell">
  <nav class="sidebar" aria-label="Main"><div class="brand">PBIBrain</div>
    <button class="nav">${I('db')}Overview</button><button class="nav">${I('search')}Search</button>
    <button class="nav" aria-current="page">${I('merge')}Development Center</button></nav>
  <main class="main"><div class="topbar">Development Center <span aria-hidden="true">/</span> Sales master merge <span aria-hidden="true">/</span> <span style="color:var(--text)">Sources</span></div>
  <div class="content">
    <div><h1>Sales master merge</h1><p class="muted small" style="margin-top:6px">Target model: Sales Master. Target report: new empty report.</p></div>
    ${locked ? `<div class="banner banner-info" role="status">${I('lock')}<div class="msg"><b>Another PBIBrain window has this session open.</b><span class="muted">You can read it, but you cannot change it.</span></div><button class="btn btn-sm">Try again</button></div>` : ''}
    <div class="tabs" role="tablist" aria-label="Session views">${['Compare','Impact','Plan','Agent','Sources','Log'].map(t => `<button class="tab" role="tab" aria-selected="${t==='Sources'}" tabindex="${t==='Sources'?0:-1}">${t}</button>`).join('')}</div>
    <div class="body${opts.pane ? ' has-pane' : ''}">
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">${inner}</div>
      ${opts.pane || ''}
    </div>
  </div></main></div>`;
}

/* ---------- Naming rules section ---------- */
const RULES = [
  { g: 'Measures', id: 'r1', text: 'Measures with currency format end with <span class="code">Amt</span>', scope: 'All tables', origin: 'Detected', sup: '37 of 40 measures', br: 3, s: 'p' },
  { g: 'Measures', id: 'r2', text: 'Measure names use Title Case', scope: 'All tables', origin: 'Detected', sup: '38 of 40 measures', br: 2, s: 'c' },
  { g: 'Measures', id: 'r3', text: 'Measures live in the table <span class="code">_Measures</span>', scope: 'All tables', origin: 'Detected', sup: '40 of 40 measures', br: 0, s: 'c' },
  { g: 'Measures', id: 'r4', text: 'Measures with percent format end with <span class="code">%</span>', scope: 'All tables', origin: 'Detected', sup: '9 of 11 measures', br: 2, s: 'p' },
  { g: 'Measures', id: 'r5', text: 'Measure names match <span class="code">^[A-Z][A-Za-z0-9 %]*$</span>', scope: 'Display folder: KPIs', origin: 'User', sup: 'Not detected', br: 1, s: 'c' },
  { g: 'Columns', id: 'r6', text: 'Data columns use PascalCase', scope: 'All tables', origin: 'Detected', sup: '112 of 131 columns', br: 19, s: 'p' },
  { g: 'Columns', id: 'r7', text: 'Key columns end with <span class="code">Key</span>', scope: 'Table: Dim*', origin: 'Detected', sup: '6 of 7 columns', br: 1, s: 'r' },
  { g: 'Tables', id: 'r8', text: 'Dimension tables start with <span class="code">Dim</span>', scope: 'All tables', origin: 'Detected', sup: '7 of 8 tables', br: 1, s: 'c' },
];
const STATUS = { p: st('s-info', 'dash', 'Proposed'), c: st('s-ok', 'okc', 'Confirmed'), r: st('s-plain', 'xc', 'Rejected') };
function rulesSection(mode) {
  const head = `<div class="section-head"><div class="t"><h2 id="h-rules">Naming rules for Sales Master</h2>
    <p class="muted small">These rules belong to the target model. Other merge sessions with this target use the same rules. Only confirmed rules and user rules mark a name.</p></div></div>`;
  if (mode === 'notarget') return `<section class="section" aria-labelledby="h-rules"><div class="section-head"><div class="t"><h2 id="h-rules">Naming rules</h2></div></div>
    <div class="empty">${I('tag')}<h3>No target model</h3><p class="muted">Set a target model to see its naming rules.</p><button class="btn">Change target</button></div></section>`;
  if (mode === 'detecting') return `<section class="section" aria-labelledby="h-rules" aria-busy="true">${head}
    <div class="empty" role="status">${I('load', 'spin run-c')}<h3>Finding naming patterns</h3><p class="muted">PBIBrain reads the names in Sales Master.</p></div></section>`;
  if (mode === 'empty') return `<section class="section" aria-labelledby="h-rules">${head}
    <div class="empty">${I('tag')}<h3>No naming patterns found</h3><p class="muted">Sales Master has too few objects with the same pattern. Add a rule or copy rules from a different model.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn btn-primary">${I('plus')}Add rule</button><button class="btn">${I('copy')}Copy rules from</button></div></div></section>`;
  const sel = mode === 'select' ? ['r1', 'r4'] : [];
  let g = '', rows = '';
  for (const r of RULES) {
    if (r.g !== g) { g = r.g; rows += `<tr class="group"><td colspan="8">${g}</td></tr>`; }
    const plain = r.text.replace(/<[^>]+>/g, '');
    const more = `<button class="btn btn-sm btn-ghost" aria-haspopup="menu" aria-expanded="false" aria-label="More actions: ${plain}"${dis}>${I('more')}</button>`;
    const acts = r.s === 'p' ? `<button class="btn btn-sm"${dis} aria-label="Confirm: ${plain}">${I('check')}Confirm</button>${more}`
      : r.s === 'r' ? `<button class="btn btn-sm"${dis} aria-label="Confirm again: ${plain}">${I('undo')}Confirm</button>`
      : `<button class="btn btn-sm btn-ghost"${dis} aria-label="Edit: ${plain}">${I('pen')}Edit</button>${more}`;
    const chk = r.s === 'p' ? `<input type="checkbox" aria-label="Select rule"${sel.includes(r.id) ? ' checked' : ''}${dis}>` : '';
    const br = r.br > 0 && r.s !== 'r' ? `<span class="breaks-warn">${I('warn')}${r.br}</span>` : `${r.br}`;
    rows += `<tr class="${sel.includes(r.id) ? 'sel' : ''} ${r.s === 'r' ? 'rejected' : ''}"><td>${chk}</td><td class="rule-text">${r.text}</td><td>${r.scope}</td><td>${r.origin}</td><td class="num">${r.sup}</td><td class="num">${br}</td><td>${STATUS[r.s]}</td><td><div class="acts">${acts}</div></td></tr>`;
  }
  return `<section class="section" aria-labelledby="h-rules">${head}
    <div class="toolbar"><div class="seg" role="group" aria-label="Show rules by status"><button aria-pressed="false">Proposed (3)</button><button aria-pressed="false">Confirmed (4)</button><button aria-pressed="false">Rejected (1)</button><button aria-pressed="true">All (8)</button></div>
      <span class="grow"></span>
      ${sel.length ? `<button class="btn btn-primary"${dis}>${I('check')}Confirm selected (2)</button>` : ''}
      <button class="btn"${dis}>${I('plus')}Add rule</button><button class="btn"${dis}>${I('copy')}Copy rules from</button></div>
    <div class="table-wrap"><table class="rules"><caption class="muted small" style="text-align:left;padding:8px 12px">Breaks: the count of existing names in Sales Master that do not obey the rule.</caption>
      <thead><tr><th scope="col"><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Select</span></th><th scope="col">Rule</th><th scope="col">Scope</th><th scope="col">Origin</th><th scope="col">Support</th><th scope="col">Breaks</th><th scope="col">Status</th><th scope="col"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Actions</span></th></tr></thead>
      <tbody>${rows}</tbody></table></div></section>`;
}

/* ---------- Rule editor pane ---------- */
function editor(err) {
  const trig = (id, label, val) => `<div class="field"><span class="lbl" id="${id}-l">${label}</span><button class="trigger" id="${id}" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="${id}-l ${id}">${val}${I('chev')}</button></div>`;
  return `<aside class="pane" role="complementary" aria-labelledby="h-ed">
    <div class="pane-head"><h2 id="h-ed">${err ? 'Add rule' : 'Edit rule'}</h2><button class="btn btn-ghost btn-sm" aria-label="Close the rule editor">${I('x')}</button></div>
    ${trig('ot', 'Object type', 'Measures')}
    ${trig('sc', 'Scope', err ? 'Display folder' : 'All tables')}
    ${err ? `<div class="field"><label for="sf">Display folder</label><div class="combo"><input id="sf" class="input" value="KPIs" role="combobox" aria-expanded="false" aria-autocomplete="list">${I('chev')}</div></div>` : ''}
    ${trig('ck', 'Check kind', err ? 'Regular expression' : 'Unit word')}
    ${err ? `<div class="field"><label for="re">Pattern</label><input id="re" class="input code" value="^[A-Z][A-Za-z0-9 %*$" aria-invalid="true" aria-describedby="re-h re-e">
        <span class="help" id="re-h">Python regular expression. PBIBrain checks the full name.</span>
        <span class="err" id="re-e">${I('xc')}<span>This pattern is not a valid regular expression: missing ] at position 6. Fix the pattern, then save the rule.</span></span></div>`
      : `<div class="field"><label for="uw">Unit word</label><input id="uw" class="input" value="Amt"></div>
         ${trig('fk', 'Format kind', 'Currency')}
         ${trig('pos', 'Position', 'End of the name')}`}
    <div class="field"><span class="lbl">Rule</span><div class="preview">${err ? 'Measures in the display folder KPIs match the pattern.' : 'Measures with currency format end with <span class="code">Amt</span>.'}</div></div>
    ${err ? '' : `<p class="muted small">Support in Sales Master: 37 of 40 measures. Breaks: 3.</p>`}
    <div class="pane-foot"><button class="btn">Cancel</button><button class="btn btn-primary">Save rule</button></div>
  </aside>`;
}

/* ---------- Cloud connect dialog ---------- */
const STEPS = ['Sign in', 'Select model', 'Access type', 'Test'];
function dialog({ title = 'Add cloud model', step, body, foot, sm, steps = STEPS }) {
  const stepList = step ? `<ol class="steps" aria-label="Steps">${steps.map((s, i) => `<li class="step ${i + 1 < step ? 'done' : ''}" ${i + 1 === step ? 'aria-current="step"' : ''}><b>${i + 1 < step ? I('check') : i + 1}</b>${s}</li>`).join('')}</ol>` : '';
  return `<div class="scrim"><div class="dialog${sm ? ' sm' : ''}" role="dialog" aria-modal="true" aria-labelledby="d-t">
    <div class="d-head"><h2 id="d-t">${title}</h2><button class="btn btn-ghost btn-sm" aria-label="Close">${I('x')}</button></div>
    ${stepList}<div class="d-body">${body}</div><div class="d-foot">${foot}</div></div></div>`;
}
const account = `<div class="account">${I('user')}<span>Signed in as <b>daniel@contoso.com</b></span><button class="link">Use a different account</button></div>`;
const back = `<button class="btn">Back</button>`;
const cancel = `<button class="btn btn-ghost">Cancel</button>`;
const checkLine = (icon, cls, k, d) => `<li>${I(icon, cls)}<span class="k">${k}</span>${d ? `<span class="d">${d}</span>` : ''}</li>`;

const SIGN_FAIL = {
  cancel: ['Sign-in stopped', 'You closed the Microsoft window before the sign-in was complete. Sign in again to continue.'],
  consent: ['Your organization must approve PBIBrain', 'An admin must give consent to the PBIBrain app in Microsoft Entra ID. Send this message to your admin, then sign in again.'],
  network: ['Cannot connect to Microsoft', 'PBIBrain did not get a reply from the Microsoft sign-in service. Check your network connection, then try again.'],
};

const D = {
  'sign-out': () => dialog({ step: 1, body: `<div class="center">${I('cloud')}<h3>Sign in to Power BI</h3>
      <p class="muted">PBIBrain reads models from your Power BI and Fabric workspaces. Sign in with your work account. Windows keeps the sign-in. PBIBrain does not save it in the project.</p></div>`,
    foot: `${cancel}<div class="right"><button class="btn btn-primary">Sign in with Microsoft</button></div>` }),
  'signing': () => dialog({ step: 1, body: `<div class="center" role="status">${I('load', 'spin run-c')}<h3>Complete the sign-in in the Microsoft window</h3>

    foot: `${cancel}<div class="right"><button class="btn btn-primary" aria-disabled="true" aria-busy="true">${I('load', 'spin')}Sign in with Microsoft</button></div>` }),
  'sign-fail': () => { const [t, d] = SIGN_FAIL[q.get('why') || 'cancel']; return dialog({ step: 1, body: `<div class="banner banner-bad" role="alert">${I('xc')}<div class="msg"><b>${t}</b><span class="muted">${d}</span></div></div>`,
    foot: `${cancel}<div class="right"><button class="btn btn-primary">Try again</button></div>` }); },
  'select': () => dialog({ step: 2, body: `${account}
      <div class="field"><label for="ws">Workspace</label><div class="combo"><input id="ws" class="input" value="Sales Analytics" role="combobox" aria-expanded="false" aria-autocomplete="list">${I('chev')}</div></div>
      <fieldset><legend>Semantic model</legend>
        <label class="radio checked"><input type="radio" name="m" checked><span>Sales Cloud</span><span class="meta">Updated 28 Oct 2026</span></label>
        <label class="radio"><input type="radio" name="m"><span>Sales Forecast</span><span class="meta">Updated 12 Oct 2026</span></label>
        <label class="radio disabled"><input type="radio" name="m" disabled><span>Sales Excel</span><span class="meta">Excel model</span><span class="why">${I('info')}PBIBrain cannot read Excel, push or live connected models through XMLA.</span></label>
      </fieldset>
      <p class="small muted">Not in the list? <button class="link">Paste a workspace connection</button></p>`,
    foot: `${back}<div class="right">${cancel}<button class="btn btn-primary">Next</button></div>` }),
  'select-nocap': () => dialog({ step: 2, body: `${account}
      <div class="field"><label for="ws">Workspace</label><div class="combo"><input id="ws" class="input" value="Team Sandbox" role="combobox" aria-expanded="false" aria-autocomplete="list">${I('chev')}</div></div>
      <div class="banner banner-warn" role="status">${I('warn')}<div class="msg"><b>XMLA is not available in this workspace</b><span class="muted">The workspace must use Premium, Premium Per User, Fabric or Embedded capacity. Select a different workspace, or ask the workspace admin to move it to a capacity.</span></div></div>`,
    foot: `${back}<div class="right">${cancel}<button class="btn btn-primary" disabled>Next</button></div>` }),
  'select-none': () => dialog({ step: 2, body: `${account}
      <div class="center">${I('folder')}<h3>No workspaces found</h3><p class="muted">This account has no workspace that PBIBrain can read. Ask a workspace admin for access, or use a different account.</p></div>`,
    foot: `${back}<div class="right">${cancel}<button class="btn btn-primary" disabled>Next</button></div>` }),
  'select-paste': () => dialog({ step: 2, body: `${account}
      <div class="field"><label for="url">Workspace connection</label><input id="url" class="input code" value="https://app.powerbi.com/groups/sales" aria-invalid="true" aria-describedby="url-h url-e">
        <span class="help" id="url-h">Copy it in Power BI: workspace settings, then License info, then Connection link. Example: powerbi://api.powerbi.com/v1.0/myorg/Sales Analytics</span>
        <span class="err" id="url-e">${I('xc')}<span>This is not a workspace connection. It must start with powerbi://. Copy the connection link again.</span></span></div>
      <div class="field"><label for="mn">Model name</label><input id="mn" class="input" value="Sales Cloud"></div>
      <p class="small muted"><button class="link">Select from the list</button></p>`,
    foot: `${back}<div class="right">${cancel}<button class="btn btn-primary">Next</button></div>` }),
  'access': () => dialog({ step: 3, body: `<fieldset><legend>Access type</legend>
        <label class="radio checked"><input type="radio" name="a" checked><span>Read</span><span class="meta">Default</span><span class="desc">PBIBrain only reads Sales Cloud. It can be a donor or a compare source. It cannot be a target.</span></label>
        <label class="radio"><input type="radio" name="a"><span>Read/Write</span><span></span><span class="desc">PBIBrain saves this choice for a later version. PBIBrain 1.0 does not write to cloud models, so the model stays read-only now.</span></label>
      </fieldset>
    foot: `${back}<div class="right">${cancel}<button class="btn btn-primary">Test connection</button></div>` }),
  'testing': () => dialog({ step: 4, body: `<div role="status" aria-live="polite"><ul class="checks">
      ${checkLine('check', 'ok-c', 'Signed in')}${checkLine('check', 'ok-c', 'Connected through XMLA')}${checkLine('load', 'spin run-c', 'Read the model')}
      ${checkLine('nc', 'nc-c', 'Find reports of this model (not run)')}</ul></div>`,
    foot: `${back}<div class="right">${cancel}<button class="btn btn-primary" aria-disabled="true">Add source</button></div>` }),
  'result': () => dialog({ step: 4, body: `<p>PBIBrain checked these conditions for <b>Sales Cloud</b>.</p>
      <div class="group-label">Checked</div><ul class="checks">
      ${checkLine('check', 'ok-c', 'Signed in as daniel@contoso.com')}
      ${checkLine('check', 'ok-c', 'Connected through XMLA')}
      ${checkLine('check', 'ok-c', 'Model read: 14 tables, 212 measures')}
      ${checkLine('check', 'ok-c', 'Capacity: Premium Per User')}
      ${checkLine('check', 'ok-c', 'Your role: Contributor')}
      ${checkLine('warn', 'warn-c', 'Reports in Sales Analytics: 6 found, 5 readable', 'Not checked: report not readable (Region KPIs). Export the report to a local PBIP, then add the PBIP folder.')}
      </ul>
      <div class="group-label">Not checked</div><ul class="checks">
      ${checkLine('nc', 'nc-c', 'Not checked: reports in other workspaces', 'PBIBrain reads reports only in the workspace of the model.')}
      ${checkLine('nc', 'nc-c', 'Not checked: write conditions', 'PBIBrain 1.0 does not write to cloud models.')}
      </ul>`,
    foot: `${back}<div class="right">${cancel}<button class="btn btn-primary">Add source</button></div>` }),
  'test-fail': () => dialog({ step: 4, body: `<ul class="checks">
      ${checkLine('check', 'ok-c', 'Signed in as daniel@contoso.com')}
      ${checkLine('xc', 'bad-c', 'Cannot read the model', 'You do not have Build permission on Sales Cloud. Ask the model owner for Build permission, then test again.')}
      ${checkLine('nc', 'nc-c', 'Find reports of this model (not run)')}</ul>`,
    foot: `${back}<div class="right">${cancel}<button class="btn btn-primary">Test again</button></div>` }),
  'report-refused': () => dialog({ title: 'Add cloud report', step: 4, steps: ['Sign in', 'Select report', 'Access type', 'Test'], body: `<ul class="checks">
      ${checkLine('check', 'ok-c', 'Signed in as daniel@contoso.com')}
      ${checkLine('xc', 'bad-c', 'Not checked: report not readable', 'PBIBrain cannot read the definition of Region KPIs. Power BI gives the definition only to users with write permission on the report. Export the report to a local PBIP, then add the PBIP folder.')}
      </ul><p class="small muted">PBIBrain did not add this report.</p>`,
    foot: `${back}<div class="right"><button class="btn">Close</button><button class="btn btn-primary">Select a different report</button></div>` }),

  /* Pull to local PBIP */
  'pull-confirm': () => dialog({ title: 'Pull to local PBIP', sm: 1, body: `<p>PBIBrain exports <b>Sales Cloud</b> as TMDL into a new local PBIP folder. The cloud model does not change.</p>
      <div class="field"><span class="lbl">Folder</span><div style="display:flex;gap:8px;align-items:center;min-width:0"><span class="src-path" style="flex:1">models/Sales Cloud</span><button class="btn btn-sm">Change folder</button></div>
        <span class="help">The folder must be empty or new.</span></div>
      <p class="small muted">After the pull, PBIBrain adds the folder as a local source. The cloud source stays in the session.</p>`,
    foot: `${cancel}<div class="right"><button class="btn btn-primary">Pull model</button></div>` }),
  'pull-notempty': () => dialog({ title: 'Pull to local PBIP', sm: 1, body: `<p>PBIBrain exports <b>Sales Cloud</b> as TMDL into a new local PBIP folder. The cloud model does not change.</p>
      <div class="field"><span class="lbl">Folder</span><div style="display:flex;gap:8px;align-items:center;min-width:0"><span class="src-path" style="flex:1">models/SalesA</span><button class="btn btn-sm">Change folder</button></div>
        <span class="err" role="alert">${I('xc')}<span>This folder is not empty. Select an empty folder or a new folder.</span></span></div>`,
    foot: `${cancel}<div class="right"><button class="btn btn-primary" disabled>Pull model</button></div>` }),
  'pull-running': () => dialog({ title: 'Pull to local PBIP', sm: 1, body: `<div role="status" aria-live="polite"><ul class="checks">
      ${checkLine('check', 'ok-c', 'Read the model')}${checkLine('load', 'spin run-c', 'Export as TMDL')}${checkLine('nc', 'nc-c', 'Write the PBIP files (not run)')}${checkLine('nc', 'nc-c', 'Add as local source (not run)')}</ul></div>`,
    foot: `<span></span><div class="right"><button class="btn btn-primary" aria-disabled="true" aria-busy="true">${I('load', 'spin')}Pull model</button></div>` }),
  'pull-done': () => dialog({ title: 'Pull to local PBIP', sm: 1, body: `<div class="banner" role="status">${I('okc', 'ok-c')}<div class="msg"><b>Sales Cloud is now a local PBIP</b><span class="muted">Folder: models/Sales Cloud. PBIBrain added it as a local source.</span></div></div>`,

  'pull-fail': () => dialog({ title: 'Pull to local PBIP', sm: 1, body: `<ul class="checks">${checkLine('check', 'ok-c', 'Read the model')}${checkLine('xc', 'bad-c', 'Cannot write the folder', 'PBIBrain cannot write to models/Sales Cloud. Make sure that you can write to this folder, then try again.')}</ul>`,
    foot: `${cancel}<div class="right"><button class="btn btn-primary">Try again</button></div>` }),

  /* Rules dialogs */
  'rules-copy': () => dialog({ title: 'Copy rules from a different model', sm: 1, body: `<fieldset><legend class="muted small" style="font-weight:400">Models in this session that have naming rules</legend>
      <label class="radio checked"><input type="radio" name="c" checked><span>Sales A</span><span class="meta">9 rules</span><span class="desc">PBIP project</span></label>
      <label class="radio"><input type="radio" name="c"><span>Sales Cloud</span><span class="meta">4 rules</span><span class="desc">Cloud model</span></label>
      <label class="radio disabled"><input type="radio" name="c" disabled><span>Sales B</span><span class="meta">0 rules</span><span class="why">${I('info')}This model has no naming rules.</span></label></fieldset>
      <p class="small muted">Copied rules arrive as Proposed in Sales Master. Confirm each rule to use it.</p>`,
    foot: `${cancel}<div class="right"><button class="btn btn-primary">Copy 9 rules</button></div>` }),
  'rules-delete': () => dialog({ title: 'Delete this rule?', sm: 1, body: `<p>Measures in the display folder KPIs match <span class="code">^[A-Z][A-Za-z0-9 %]*$</span>.</p>
      <p class="muted">PBIBrain stops checking names against this rule. Plan warnings for this rule go away.</p>`,
    foot: `<span></span><div class="right"><button class="btn">Cancel</button><button class="btn btn-danger-fill">${I('trash')}Delete rule</button></div>` }),
};

const SCREENS = {
  rules: () => workFrame(sourcesSection() + rulesSection('all')),
  'rules-select': () => workFrame(rulesSection('select')),
  'rules-menu': () => workFrame(rulesSection('all')) + `<div role="menu" aria-label="Rule actions" class="rowmenu"><button role="menuitem" class="mi">${I('pen')}Edit</button><button role="menuitem" class="mi">${I('xc')}Reject</button></div>`,
  'rules-editor': () => workFrame(rulesSection('all'), { pane: editor(false) }),
  'rules-editor-error': () => workFrame(rulesSection('all'), { pane: editor(true) }),
  'rules-empty': () => workFrame(rulesSection('empty')),
  'rules-notarget': () => workFrame(rulesSection('notarget')),
  'rules-detecting': () => workFrame(rulesSection('detecting')),
  'rules-locked': () => workFrame(sourcesSection() + rulesSection('all')),
  'rules-stale': () => workFrame(rulesSection('all')) + `<div class="toast" role="status">${I('info', 'run-c')}<span>The session changed in a different place. PBIBrain loaded the new state. Do the action again.</span></div>`,
};
const app = document.getElementById('app');
app.innerHTML = SCREENS[S] ? SCREENS[S]() : workFrame(sourcesSection() + rulesSection('all')) + (D[S] ? D[S]() : '');
</script>
